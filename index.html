<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>библиотека</title>
  <meta name="description" content="дверь приоткрыта, хорошего тебе прочтения">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://enpierce.cc/">
  <meta property="og:site_name" content="enpierce.cc">
  <meta property="og:title" content="библиотека">
  <meta property="og:description" content="дверь приоткрыта, хорошего тебе прочтения">
  <meta property="og:image" content="https://enpierce.cc/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="пиксельная библиотека с красным сердцем над дверью">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 6' shape-rendering='crispEdges'%3E%3Cpath fill='%23ff2020' d='M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene" id="scene"></div>

  <div class="box" id="box" aria-live="polite"></div>
  <div class="curtain" id="curtain"></div>

  <div class="overlay" id="mail" hidden>
    <canvas id="bigEnvelope" width="34" height="36"></canvas>
    <button type="button" class="action" id="openEnvelope"></button>
  </div>

  <div class="letter" id="letter" hidden tabindex="-1">
    <div class="letter__inner">
      <p class="letter__text" aria-hidden="true"><span id="typed"></span><span class="rest" id="rest"></span></p>
      <div class="answers is-pending" id="letterEnd"></div>
    </div>
  </div>

  <button type="button" class="sound" id="sound" hidden></button>

  <script src="script.js"></script>
</body>
</html>
